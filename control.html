<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Pro — Control</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-control.svg" type="image/svg+xml">
  <meta name="theme-color" content="#1a2540">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Control">
  <link rel="apple-touch-icon" href="/icon-control.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: hidden; width: 100%; }

    :root {
      --bg:       #0c0a08;
      --card-bg:  #13110e;
      --border:   #2a2318;
      --gold:     #c8a44e;
      --gold-dim: rgba(200,164,78,0.14);
      --text:     #e8e0d0;
      --muted:    #7a6a4a;
      --green:    #4caf50;
      --red:      #ef5350;
      --r:        14px;
    }

    body {
      background: radial-gradient(ellipse at 25% 0%, rgba(200,164,78,0.05) 0%, transparent 55%),
                  radial-gradient(ellipse at 75% 100%, rgba(200,164,78,0.03) 0%, transparent 50%),
                  var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
    }

    /* ─── LOGIN ─── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .login-box {
      background: var(--card-bg);
      border: 1px solid rgba(200,164,78,0.2);
      border-radius: 18px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 0 0 1px rgba(200,164,78,0.05), 0 24px 64px rgba(0,0,0,0.6);
    }

    .login-box h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.1rem;
      color: var(--gold);
      margin-bottom: 0.25rem;
      letter-spacing: 0.03em;
    }

    .login-box p {
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 2rem;
    }

    .login-box input[type="password"] {
      width: 100%;
      padding: 0.8rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      margin-bottom: 0.875rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .login-box input[type="password"]:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(200,164,78,0.12);
    }

    .btn-gold {
      width: 100%;
      padding: 0.8rem 1rem;
      background: linear-gradient(135deg, #d4a94e, #b8922e);
      color: #0c0a08;
      border: none;
      border-radius: 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      letter-spacing: 0.03em;
    }

    .btn-gold:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-gold:active { transform: translateY(0); }

    .login-error {
      color: var(--red);
      font-size: 0.82rem;
      margin-top: 0.75rem;
      display: none;
    }

    /* ─── DASHBOARD ─── */
    #dashboard { display: none; }

    header {
      background: rgba(19,17,14,0.97);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(200,164,78,0.18);
      padding: 0.9rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    .hd-inner {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .hd-icon {
      width: 34px; height: 34px;
      background: var(--gold-dim);
      border: 1px solid rgba(200,164,78,0.28);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; color: var(--gold); flex-shrink: 0;
    }

    .hd-left h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      color: var(--gold);
      line-height: 1.2;
      letter-spacing: 0.02em;
    }

    .hd-left span {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .btn-logout {
      padding: 0.45rem 1.1rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: 'Outfit', sans-serif;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-logout:hover { border-color: var(--gold); color: var(--gold); }

    main {
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
      padding-bottom: 6rem;
    }

    .clients-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr));
      gap: 1.5rem;
    }

    /* ─── CARD ─── */
    .client-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-left: 3px solid rgba(200,164,78,0.3);
      border-right: 3px solid rgba(200,164,78,0.3);
      border-radius: var(--r);
      padding: 1.5rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
      transition: border-left-color 0.3s, border-right-color 0.3s, box-shadow 0.3s, transform 0.2s;
      scroll-margin-top: 5rem;
    }

    .client-card:hover {
      border-left-color: var(--gold);
      border-right-color: var(--gold);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(200,164,78,0.07);
      transform: translateY(-1px);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .card-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      color: var(--gold);
      line-height: 1.2;
      letter-spacing: 0.02em;
    }

    .card-slug {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
      margin-top: 6px;
      transition: background 0.4s, box-shadow 0.4s;
    }

    .status-dot.online  { background: var(--green); box-shadow: 0 0 8px rgba(76,175,80,0.7); }
    .status-dot.offline { background: var(--red); box-shadow: 0 0 6px rgba(239,83,80,0.5); }

    .card-links {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .card-link {
      padding: 0.28rem 0.75rem;
      background: var(--gold-dim);
      border: 1px solid rgba(200,164,78,0.22);
      border-radius: 20px;
      color: var(--gold);
      font-size: 0.73rem;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }

    .card-link:hover { background: rgba(200,164,78,0.24); border-color: rgba(200,164,78,0.4); }

    .section-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin: 1rem 0 0.6rem;
      padding-left: 0.55rem;
      border-left: 2px solid rgba(200,164,78,0.4);
    }

    /* ─── MODE SELECTOR ─── */
    .mode-selector {
      display: flex;
      gap: 0.35rem;
      margin-bottom: 1.25rem;
    }

    .mode-selector input[type="radio"] { display: none; }

    .mode-selector label {
      flex: 1;
      padding: 0.48rem 0.2rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.76rem;
      text-align: center;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s;
      user-select: none;
    }

    .mode-selector input[type="radio"]:checked + label {
      background: var(--gold-dim);
      border-color: var(--gold);
      color: var(--gold);
      font-weight: 500;
    }

    /* ─── TOGGLES ─── */
    .toggles {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle-label { font-size: 0.84rem; }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }

    .toggle input { display: none; }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.25s;
    }

    .toggle input:checked ~ .toggle-track {
      background: linear-gradient(135deg, #d4a94e, #b8922e);
      border-color: transparent;
    }

    .toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .toggle input:checked ~ .toggle-thumb { transform: translateX(20px); }

    /* ─── FEAT LIST (licences) ─── */
    .feat-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-bottom: 1.25rem;
      background: rgba(255,255,255,0.02);
      border-radius: 10px;
      padding: 0.5rem 0.75rem;
      border: 1px solid rgba(255,255,255,0.03);
    }
    .feat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.2rem 0;
    }
    .feat-label { font-size: 0.84rem; }

    /* ─── PASSWORD ─── */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.25rem 0;
    }

    .pw-row {
      display: flex;
      gap: 0.5rem;
    }

    .pw-row input[type="password"] {
      flex: 1;
      padding: 0.52rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 0.84rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      min-width: 0;
    }

    .pw-row input[type="password"]:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(200,164,78,0.1);
    }

    .btn-update {
      padding: 0.52rem 0.9rem;
      background: linear-gradient(135deg, #d4a94e, #b8922e);
      color: #0c0a08;
      border: none;
      border-radius: 8px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s, transform 0.15s;
      flex-shrink: 0;
    }

    .btn-update:hover   { opacity: 0.88; transform: translateY(-1px); }
    .btn-update:active  { transform: translateY(0); }
    .btn-update:disabled { opacity: 0.4; cursor: default; transform: none; }

    .pw-feedback {
      font-size: 0.73rem;
      margin-top: 0.35rem;
      min-height: 1em;
    }

    .pw-feedback.ok  { color: var(--green); }
    .pw-feedback.err { color: var(--red); }

    /* ─── LANGUAGES ─── */
    .lang-section {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      margin-bottom: 1.25rem;
    }
    .lang-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .lang-label { font-size: 0.84rem; }
    .lang-sel {
      padding: 0.3rem 0.6rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 0.78rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }
    .lang-sel:focus { border-color: var(--gold); }

    /* ─── EVENT SELECT ─── */
    .event-select-row { margin-bottom: 1rem; }
    .event-sel {
      width: 100%;
      padding: 0.45rem 0.7rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }
    .event-sel:focus { border-color: var(--gold); }

    /* ─── LANG TOGGLES ─── */
    .lang-toggles {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
    }
    .lang-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .lang-toggle-label { font-size: 0.84rem; }

    /* ─── COLLAPSIBLE CARD ─── */
    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .card-collapse-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      cursor: pointer;
      color: var(--muted);
      padding: 4px 6px;
      border-radius: 7px;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
      flex-shrink: 0;
    }
    .card-collapse-btn:hover { color: var(--gold); border-color: rgba(200,164,78,0.35); background: var(--gold-dim); }
    .card-collapse-btn svg { transition: transform 0.28s cubic-bezier(0.4,0,0.2,1); display: block; }
    .client-card.collapsed .card-collapse-btn svg { transform: rotate(-90deg); }
    .card-body {
      overflow: hidden;
      max-height: 2000px;
      opacity: 1;
      transition: max-height 0.4s ease, opacity 0.3s ease;
    }
    .client-card.collapsed .card-body { max-height: 0; opacity: 0; }

    /* ─── RETENTION ─── */
    .retention-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 0; border-bottom: 1px solid rgba(200,164,78,0.07);
    }
    .retention-row:last-child { border-bottom: none; }
    .retention-label { font-size: 0.78rem; color: var(--muted); }
    .retention-sel {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 0.74rem;
      padding: 5px 8px; cursor: pointer; font-family: inherit;
      appearance: none; -webkit-appearance: none; outline: none;
      transition: border-color 0.2s;
    }
    .retention-sel:focus { border-color: var(--gold); }

    /* ─── CONFIRM RETENTION MODAL ─── */
    #retention-modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 300; align-items: center; justify-content: center; padding: 1.5rem;
    }
    #retention-modal.open { display: flex; }
    .ret-modal-box {
      background: var(--card-bg); border: 1px solid rgba(200,164,78,0.25);
      border-radius: 18px; padding: 28px 24px; max-width: 400px; width: 100%;
      display: flex; flex-direction: column; gap: 14px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.7);
    }
    .ret-modal-icon { font-size: 1.8rem; text-align: center; }
    .ret-modal-title { font-size: 0.95rem; font-weight: 600; color: var(--text); text-align: center; }
    .ret-modal-body { font-size: 0.8rem; color: var(--muted); line-height: 1.7; text-align: center; }
    .ret-modal-body strong { color: var(--text); }
    .ret-modal-body .warn { color: #e8a44a; }
    .ret-modal-btns { display: flex; gap: 10px; margin-top: 4px; }
    .ret-modal-btns button { flex: 1; padding: 11px; border-radius: 10px; font-family: inherit; font-size: 0.82rem; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .ret-btn-cancel { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .ret-btn-cancel:hover { border-color: var(--gold); color: var(--gold); }
    .ret-btn-ok { background: linear-gradient(135deg, #d4a94e, #b8922e); border: none; color: #000; }
    .ret-btn-ok:hover { opacity: 0.88; }

    /* ─── MODAL ─── */
    #lang-modal, #theme-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    #lang-modal.open { display: flex; }
    #theme-modal.open { display: flex; }
    .modal-box {
      background: var(--card-bg);
      border: 1px solid rgba(200,164,78,0.2);
      border-radius: 16px;
      padding: 2rem 1.75rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6);
    }
    .modal-box h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      color: var(--gold);
      margin-bottom: 0.75rem;
    }
    .modal-box p { font-size: 0.85rem; color: var(--text); margin-bottom: 1rem; line-height: 1.5; }
    .modal-sel {
      width: 100%;
      padding: 0.52rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 0.84rem;
      outline: none;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s;
    }
    .modal-sel:focus { border-color: var(--gold); }
    .modal-actions { display: flex; gap: 0.5rem; }
    .modal-confirm {
      flex: 1;
      padding: 0.65rem 1rem;
      background: linear-gradient(135deg, #d4a94e, #b8922e);
      color: #0c0a08;
      border: none;
      border-radius: 8px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .modal-confirm:hover { opacity: 0.88; }
    .modal-cancel {
      flex: 1;
      padding: 0.65rem 1rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: 'Outfit', sans-serif;
      font-size: 0.84rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .modal-cancel:hover { border-color: var(--gold); color: var(--gold); }

    /* ─── VARIANTES PAR THÈME ─── */
    .variant-btn {
      background: none; border: 1px solid var(--border); border-radius: 6px;
      color: var(--muted); cursor: pointer; font-size: 0.75rem;
      padding: 2px 8px; margin-left: 6px; flex-shrink: 0;
      transition: border-color 0.2s, color 0.2s;
    }
    .variant-btn:hover { border-color: var(--gold); color: var(--gold); }
    #variant-modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 200;
      align-items: center; justify-content: center;
      padding: 1.5rem;
    }
    #variant-modal.open { display: flex; }
    .variant-modal-box {
      max-height: 82vh; overflow-y: auto;
    }
    .variant-list { display: flex; flex-direction: column; gap: 10px; margin: 0.5rem 0 1rem; }
    .variant-item { display: flex; align-items: center; gap: 10px; }
    .variant-cb { width: 16px; height: 16px; accent-color: var(--gold); cursor: pointer; flex-shrink: 0; }
    .variant-dot { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.15); }
    .variant-name { font-size: 0.84rem; color: var(--text); }

    /* ─── DEMO PHOTOS ─── */
    .dp-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 1rem; margin-bottom: 1.25rem;
    }
    .dp-item { display: flex; flex-direction: column; gap: 0.45rem; }
    .dp-num { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
    .dp-preview {
      width: 100%; height: 80px; background: var(--bg); border: 1px dashed var(--border);
      border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    .dp-preview img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .dp-cam { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); }
    .dp-cam svg { width: 26px; height: 26px; opacity: 0.35; }
    .dp-cam span { font-size: 0.62rem; letter-spacing: 0.05em; text-transform: uppercase; }
    .dp-btns { display: flex; gap: 0.4rem; }
    .dp-upload-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.4rem;
      padding: 0.45rem 0.6rem; background: var(--gold-dim); border: 1px solid rgba(200,164,78,0.28);

// ══════════════════════════════════════════
// SHA-256
// ══════════════════════════════════════════

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// ══════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════

async function tryLogin() {
  const pw   = document.getElementById('login-pw').value;
  const hash = await sha256(pw);
  if (hash === CONTROL_HASH) {
    sessionStorage.setItem('ctrl_auth', '1');
    showDashboard();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}

document.getElementById('login-pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') tryLogin();
});

function logout() {
  sessionStorage.removeItem('ctrl_auth');
  location.reload();
}

// ══════════════════════════════════════════

// ══════════════════════════════════════════

function updateClock() {

  document.getElementById('clock').textContent =

    ' · ' +
    now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

// ══════════════════════════════════════════
// FIREBASE — instances par client
// ══════════════════════════════════════════

const _dbs = {};

function getDb(slug) {
  if (!_dbs[slug]) {
    const client      = CLIENTS.find(c => c.slug === slug);
    const existing    = firebase.apps.find(a => a.name === slug);
    const app         = existing || firebase.initializeApp(client.firebaseConfig, slug);
    _dbs[slug]        = firebase.database(app);
  }
  return _dbs[slug];
}

// ══════════════════════════════════════════
// STATUS
// ══════════════════════════════════════════

async function checkStatus(url) {
  try {
    await fetch(url, { method: 'HEAD', mode: 'no-cors', cache: 'no-store' });
    return true;
  } catch {
    return false;
  }
}

// ══════════════════════════════════════════
// ══════════════════════════════════════════
// RETENTION — OPTIONS & HELPERS
// ══════════════════════════════════════════

const RETENTION_OPTS = [
  { ms: 86400000,    label: '24 heures' },
  { ms: 172800000,   label: '48 heures' },
  { ms: 259200000,   label: '72 heures' },
  { ms: 604800000,   label: '1 semaine' },
  { ms: 1209600000,  label: '2 semaines' },
  { ms: 1814400000,  label: '3 semaines' },
  { ms: 2592000000,  label: '1 mois' },
  { ms: 5184000000,  label: '2 mois' },
  { ms: 7776000000,  label: '3 mois' },
  { ms: 15552000000, label: '6 mois' },
];

function retentionOptions() {
  return RETENTION_OPTS.map(o =>
    `<option value="${o.ms}">${o.label}</option>`
  ).join('');
}

let _pendingRetention = null;

function writeRetention(slug, type, selectEl) {
  const newMs  = parseInt(selectEl.value);
  const db     = getDb(slug);
  const label  = type === 'calls' ? 'des appels' : 'des commandes';
  const newLbl = RETENTION_OPTS.find(o => o.ms === newMs)?.label || '?';

  db.ref(`/config/retention/${type}`).once('value').then(snap => {
    const currentMs  = snap.val() || 604800000;
    const currentLbl = RETENTION_OPTS.find(o => o.ms === currentMs)?.label || '?';
    const isReduction = newMs < currentMs;

    _pendingRetention = { slug, type, newMs, prevMs: currentMs, el: selectEl };

    document.getElementById('ret-modal-title').textContent =
      `Modifier la rétention ${label}`;

    let body = `Durée actuelle\u00a0: <strong>${currentLbl}</strong><br>Nouvelle durée\u00a0: <strong>${newLbl}</strong>`;
    if (isReduction) {
      body += `<br><br><span class="warn">⚠️ Les données au-delà de <strong>${newLbl}</strong> seront <strong>cachées immédiatement</strong> et supprimées définitivement de Firebase <strong>1 semaine après</strong> cette validation.</span>`;
    }
    document.getElementById('ret-modal-body').innerHTML = body;
    document.getElementById('retention-modal').classList.add('open');
  });
}

function cancelRetention() {
  if (_pendingRetention) {
    _pendingRetention.el.value = _pendingRetention.prevMs;
    _pendingRetention = null;
  }
  document.getElementById('retention-modal').classList.remove('open');
}

async function confirmRetention() {
  if (!_pendingRetention) return;
  const { slug, type, newMs, prevMs } = _pendingRetention;
  const isReduction = newMs < prevMs;
  await getDb(slug).ref('/config/retention').update({
    [type]:                    newMs,
    [`${type}ChangedAt`]:      Date.now(),
    [`${type}Previous`]:       prevMs,
    [`${type}IsReduction`]:    isReduction,
  }).catch(console.error);
  _pendingRetention = null;
  document.getElementById('retention-modal').classList.remove('open');
}

// BUILD CARD HTML

// ══════════════════════════════════════════
// CARD TOGGLE
// ══════════════════════════════════════════

function toggleCard(id) {
  const card = document.getElementById('card-' + id);
  if (card) card.classList.toggle('collapsed');
}

async function openAdmin(e, slug) {
  e.preventDefault();
  const client = CLIENTS.find(c => c.slug === slug);
  await getDb(slug).ref('/config/ctrlBypass').set(Date.now());
  window.open(client.url + '/admin.html?ctrl=1', '_blank');
}

// ══════════════════════════════════════════
// ÉTAT PAR CLIENT (langues)
// ══════════════════════════════════════════

const _clientState = {};

function getClientState(slug) {
  if (!_clientState[slug]) _clientState[slug] = { defaultLang: null, primaryLang: null, enabledLangs: {} };
  return _clientState[slug];
}

// ══════════════════════════════════════════
// TOGGLE LANGUE — avec protection popup
// ══════════════════════════════════════════

let _pendingDisable = null;

async function onLangToggle(slug, lang, checkbox) {
  const state = getClientState(slug);
  const enabled = checkbox.checked;

  if (!enabled) {
    const client = CLIENTS.find(c => c.slug === slug);
    const remaining = (client.langs || []).filter(l => l !== lang && state.enabledLangs[l] !== false);
    if (remaining.length === 0) {
      checkbox.checked = true;
      return;
    }

    const isDefault = state.defaultLang === lang;
    const isPrimary = state.primaryLang === lang;

    if (isDefault || isPrimary) {
      _pendingDisable = { slug, lang, checkbox };
      const roles = [];
      if (isDefault) roles.push('la langue affichée (1ère visite)');
      if (isPrimary) roles.push('la langue admin (saisie)');
      document.getElementById('modal-msg').innerHTML =
        `<strong>${LANG_LABELS[lang]||lang}</strong> est actuellement ${roles.join(' et ')}.<br>Choisissez une langue de remplacement :`;
      const sel = document.getElementById('modal-sel');
      sel.innerHTML = remaining.map(l => `<option value="${l}">${LANG_LABELS[l]||l}</option>`).join('');
      document.getElementById('lang-modal').classList.add('open');
      return;
    }
  }

  await writeEnabledLang(slug, lang, enabled);
}

async function confirmLangDisable() {
  if (!_pendingDisable) return;
  const { slug, lang } = _pendingDisable;
  const state = getClientState(slug);
  const replacement = document.getElementById('modal-sel').value;

  await writeEnabledLang(slug, lang, false);
  if (state.defaultLang === lang) await writeDefaultLang(slug, replacement);
  if (state.primaryLang === lang) await writePrimaryLang(slug, replacement);

  document.getElementById('lang-modal').classList.remove('open');
  _pendingDisable = null;
}

function cancelLangDisable() {
  if (_pendingDisable) {
    _pendingDisable.checkbox.checked = true;
    _pendingDisable = null;
  }
  document.getElementById('lang-modal').classList.remove('open');
}

let pendingThemeDisable = null;

window.toggleThemeVis = function(slug, themeId, isChecked) {
  const db = getDb(slug);

  if (!isChecked) {
    db.ref('menu').once('value').then(snap => {
      const data = snap.val() || {};
      const activeTheme = data.menuTheme || 'gold-noir';
      const hiddenThemes = data.hiddenThemes || {};

      if (activeTheme === themeId) {
        pendingThemeDisable = { slug, themeId, db };
        const sel = document.getElementById('theme-modal-sel');
        sel.innerHTML = ALL_THEMES_LIST
          .filter(th => th.id !== themeId && !hiddenThemes[th.id])
          .map(th => `<option value="${th.id}">${th.name}</option>`)
          .join('');
        const themeName = (ALL_THEMES_LIST.find(t => t.id === themeId) || {}).name || themeId;
        document.getElementById('theme-modal-msg').textContent =
          `Le thème "${themeName}" est actuellement utilisé par le menu. Choisissez un autre thème pour le remplacer avant de le masquer :`;
        document.getElementById('theme-modal').classList.add('open');
      } else {
        db.ref('menu/hiddenThemes/' + themeId).set(true);
      }
    });
  } else {
    db.ref('menu/hiddenThemes/' + themeId).set(null);
  }
};

window.confirmThemeDisable = function() {
  if (!pendingThemeDisable) return;
  const { themeId, db } = pendingThemeDisable;
  const newTheme = document.getElementById('theme-modal-sel').value;
  db.ref('menu').update({
    menuTheme: newTheme,
    ['hiddenThemes/' + themeId]: true
  }).then(() => {
    document.getElementById('theme-modal').classList.remove('open');
    pendingThemeDisable = null;
  });
};

window.cancelThemeDisable = function() {
  if (!pendingThemeDisable) {
    document.getElementById('theme-modal').classList.remove('open');
    return;
  }
  const { slug, themeId } = pendingThemeDisable;
  const cb = document.querySelector(`#theme-toggles-${slug} input[data-id="${themeId}"]`);
  if (cb) cb.checked = true;
  document.getElementById('theme-modal').classList.remove('open');
  pendingThemeDisable = null;
};

const _clientVariants = {};
let _variantSlug   = null;
let _variantFamily = null;

function openVariantPopup(slug, family) {
  const tv = THEME_VARIANTS.find(t => t.family === family);
  if (!tv) return;
  _variantSlug   = slug;
  _variantFamily = family;

  const saved          = (_clientVariants[slug] && _clientVariants[slug][family]) || {};
  const hiddenVariants = saved.hidden  || {};
  const defaultVariant = saved.default || tv.variants[0].id;

  document.getElementById('variant-modal-title').textContent = tv.name + ' — Couleurs';

  const list = document.getElementById('variant-list');
  list.innerHTML = tv.variants.map(v => `
    <div class="variant-item">
      <input type="checkbox" class="variant-cb" id="vcb-${v.id}" value="${v.id}"
             ${!hiddenVariants[v.id] ? 'checked' : ''} onchange="onVariantCheckChange('${v.id}')">
      <div class="variant-dot" style="background:${v.color}"></div>
      <label class="variant-name" for="vcb-${v.id}">${v.name}</label>
    </div>`).join('');

  _buildDefaultSelect(tv, hiddenVariants, defaultVariant);
  document.getElementById('variant-modal').classList.add('open');
}

function _buildDefaultSelect(tv, hiddenVariants, currentDefault) {
  const sel     = document.getElementById('variant-default-sel');
  const visible = tv.variants.filter(v => !hiddenVariants[v.id]);
  sel.innerHTML = visible.map(v =>
    `<option value="${v.id}" ${v.id === currentDefault ? 'selected' : ''}>${v.name}</option>`
  ).join('');
  if (!visible.find(v => v.id === currentDefault) && visible.length > 0) {
    sel.value = visible[0].id;
  }
}

function onVariantCheckChange(changedVarId) {
  const tv = THEME_VARIANTS.find(t => t.family === _variantFamily);
  if (!tv) return;

  const defSel   = document.getElementById('variant-default-sel');
  const curDef   = defSel.value;
  const checkedIds = tv.variants
    .filter(v => { const cb = document.getElementById(`vcb-${v.id}`); return cb && cb.checked; })
    .map(v => v.id);

  // If the unchecked variant was the default AND other variants remain → auto-check standard
  if (changedVarId === curDef && checkedIds.length > 0) {
    const standardId = tv.variants[0].id;
    if (!checkedIds.includes(standardId)) {
      const cb = document.getElementById(`vcb-${standardId}`);
      if (cb) { cb.checked = true; checkedIds.push(standardId); }
    }
  }

  const hiddenVariants = {};
  tv.variants.forEach(v => { if (!checkedIds.includes(v.id)) hiddenVariants[v.id] = true; });
  _buildDefaultSelect(tv, hiddenVariants, curDef);
}

function onVariantDefaultChange() { /* handled by _buildDefaultSelect */ }

async function saveVariantConfig() {
  const tv = THEME_VARIANTS.find(t => t.family === _variantFamily);
  if (!tv || !_variantSlug) return;

  const hiddenVariants = {};
  let allHidden = true;
  tv.variants.forEach(v => {
    const cb = document.getElementById(`vcb-${v.id}`);
    if (cb && !cb.checked) { hiddenVariants[v.id] = true; }
    else { allHidden = false; }
  });

  const defaultVariant = document.getElementById('variant-default-sel').value || tv.variants[0].id;
  const db = getDb(_variantSlug);

  await db.ref(`/config/features/themeVariants/${_variantFamily}`).set({
    hidden:  Object.keys(hiddenVariants).length > 0 ? hiddenVariants : null,
    default: defaultVariant
  }).catch(console.error);

  if (allHidden) {
    // Hide the whole theme family
    await db.ref('menu/hiddenThemes/' + _variantFamily).set(true).catch(console.error);
    const cb = document.querySelector(`#theme-toggles-${_variantSlug} input[data-id="${_variantFamily}"]`);
    if (cb) cb.checked = false;
  } else {
    // If active theme is now a hidden variant → switch to default
    const menuSnap   = await db.ref('menu').once('value');
    const activeTheme = (menuSnap.val() || {}).menuTheme || tv.variants[0].id;
    if (tv.variants.some(v => v.id === activeTheme) && hiddenVariants[activeTheme]) {
      await db.ref('menu/menuTheme').set(defaultVariant).catch(console.error);
    }
  }

  closeVariantModal();
}

function closeVariantModal() {
  document.getElementById('variant-modal').classList.remove('open');
  _variantSlug   = null;
  _variantFamily = null;
}

function initClient(client) {
  const s  = client.slug;
  const id = s.replace(/-/g, '_');
  const db = getDb(s);

  // Styles disponibles (licence)
  db.ref('/config/features/styles').on('value', snap => {
    const styles = snap.val() || {};
    ['simple','paper'].forEach(style => {
      const el = document.getElementById(`feat-style-${style}-${id}`);
      if (el) el.checked = styles[style] !== false;
    });
  });

  // Boutons disponibles (licence)
  db.ref('/config/features/buttons').on('value', snap => {
    const buttons = snap.val() || {};
    ['callBtn','orderUI','photos','eventOverlay'].forEach(btn => {
      const el = document.getElementById(`feat-btn-${btn}-${id}`);
      if (el) el.checked = buttons[btn] !== false;
    });
  });

  // Langue par défaut (menu visiteur)
  db.ref('/config/defaultLang').on('value', snap => {
    const val = snap.val();
    getClientState(s).defaultLang = val;
    const el = document.getElementById(`default-lang-${id}`);
    if (el && val) el.value = val;
  });

  // Langue principale (saisie admin)
  db.ref('/config/primaryLang').on('value', snap => {
    const val = snap.val();
    getClientState(s).primaryLang = val;
    const el = document.getElementById(`primary-lang-${id}`);
    if (el && val) el.value = val;
  });

  // Langues disponibles (toggles)
  db.ref('/config/enabledLangs').on('value', snap => {
    const enabledLangs = snap.val() || {};
    getClientState(s).enabledLangs = enabledLangs;
    (client.langs || []).forEach(l => {
      const el = document.getElementById(`lang-en-${l}-${id}`);
      if (el) el.checked = enabledLangs[l] !== false;
    });
  });

  // Fête active
  db.ref('/menu/activeEvent').on('value', snap => {
    const val = snap.val() || '';
    const el = document.getElementById(`event-sel-${id}`);
    if (el) el.value = val;
  });

  // Rétention historique
  db.ref('/config/retention').on('value', snap => {
    const r = snap.val() || {};
    const callsSel  = document.getElementById(`ret-calls-${id}`);
    const ordersSel = document.getElementById(`ret-orders-${id}`);
    if (callsSel)  callsSel.value  = r.calls  || 604800000;
    if (ordersSel) ordersSel.value = r.orders || 604800000;
  });

  // Statut
  checkStatus(client.url).then(online => {
    const dot = document.getElementById(`status-${id}`);
    if (dot) dot.classList.add(online ? 'online' : 'offline');
  });

  // Variantes de thème
  db.ref('/config/features/themeVariants').on('value', snap => {
    _clientVariants[s] = snap.val() || {};
  });

  // Thèmes masqués
  db.ref('menu/hiddenThemes').on('value', snap => {
    const hiddenData = snap.val() || {};
    const ctn = document.getElementById(`theme-toggles-${s}`);
    if (!ctn) return;
    ctn.innerHTML = ALL_THEMES_LIST.map(th => {
      const isVisible = !hiddenData[th.id];
      const hasVariants = THEME_VARIANTS.some(tv => tv.family === th.id);
      return `
        <div class="toggle-row">
          <div style="display:flex;align-items:center;gap:6px;">
            <span class="toggle-label">${th.name}</span>
            ${hasVariants ? `<button class="variant-btn" onclick="openVariantPopup('${s}','${th.id}')">🎨</button>` : ''}
          </div>
          <label class="toggle">
            <input type="checkbox" data-id="${th.id}" ${isVisible ? 'checked' : ''} onchange="toggleThemeVis('${s}', '${th.id}', this.checked)">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
        </div>`;
    }).join('');
  });
}

const STYLE_PRIORITY = ['paper','simple'];

async function writeFeatureStyle(slug, style, enabled) {
  const db = getDb(slug);
  await db.ref(`/config/features/styles/${style}`).set(enabled).catch(console.error);

  if (!enabled) {
    // Si le style actif vient d'être désactivé → basculer sur le prochain disponible
    const snap = await db.ref('/config/features/styles').once('value');
    const styles = snap.val() || {};
    const currentSnap = await db.ref('/menu/menuStyle').once('value');
    const current = currentSnap.val() || 'paper';
    if (current === style) {
      const next = STYLE_PRIORITY.find(s => s !== style && styles[s] !== false);
      if (next) {
        await db.ref('/menu/menuStyle').set(next).catch(console.error);
      }
    }
  }
}

async function writeFeatureBtn(slug, btn, enabled) {
  const db = getDb(slug);
  await db.ref(`/config/features/buttons/${btn}`).set(enabled).catch(console.error);

  const keyMap = { callBtn: 'showCallBtn', orderUI: 'showOrderUI', photos: 'showPhotos', eventOverlay: 'showEventOverlay' };
  const fireKey = keyMap[btn];
  if (fireKey) {
    await db.ref(`/menu/info/${fireKey}`).set(enabled).catch(console.error);
  }
  // Si l'overlay fêtes est désactivé → effacer la fête active
  if (btn === 'eventOverlay' && !enabled) {
    await db.ref('/menu/activeEvent').set(null).catch(console.error);
  }
}

async function writeActiveEvent(slug, eventId) {
  await getDb(slug).ref('/menu/activeEvent').set(eventId || null).catch(console.error);
}

async function writeDefaultLang(slug, lang) {
  await getDb(slug).ref('/config/defaultLang').set(lang).catch(console.error);
}

async function writePrimaryLang(slug, lang) {
  await getDb(slug).ref('/config/primaryLang').set(lang).catch(console.error);
}

async function writeEnabledLang(slug, lang, enabled) {
  await getDb(slug).ref(`/config/enabledLangs/${lang}`).set(enabled).catch(console.error);
}

async function updatePassword(slug) {
  const id       = slug.replace(/-/g, '_');
  const input    = document.getElementById(`pw-${id}`);
  const feedback = document.getElementById(`pwfb-${id}`);
  const btn      = input.nextElementSibling;

  const pw = input.value.trim();
  if (!pw) {
    feedback.textContent = 'Entrez un mot de passe.';
    feedback.className   = 'pw-feedback err';
    return;
  }

  btn.disabled         = true;
  feedback.textContent = '';

  try {
    const hash = await sha256(pw);
    await getDb(slug).ref('/config/adminHash').set(hash);
    feedback.textContent = '✓ Mis à jour';
    feedback.className   = 'pw-feedback ok';
    input.value          = '';
    setTimeout(() => { feedback.textContent = ''; }, 3000);
  } catch {
    feedback.textContent = 'Erreur Firebase';
    feedback.className   = 'pw-feedback err';
  } finally {
    btn.disabled = false;
  }
}

function buildCtrlNav() {
  const nav = document.getElementById('ctrl-nav');
  const btn = document.getElementById('ctrl-nav-btn');
  if (!nav) return;

  let html = '<div class="ctrl-nav-cat">Page Demo</div>';
  html += `<button class="ctrl-nav-item" onclick="navToCard('demo_page')"><span class="ctrl-nav-dot"></span>Page Démo</button>`;

  if (CLIENTS.length > 0) {
    html += '<hr class="ctrl-nav-sep"><div class="ctrl-nav-cat">Menus</div>';
    CLIENTS.forEach(client => {
      const id = client.slug.replace(/-/g, '_');
      html += `<button class="ctrl-nav-item" onclick="navToCard('${id}')"><span class="ctrl-nav-dot"></span>${client.name}</button>`;
    });
  }

  nav.innerHTML = html;
  btn.style.display = 'flex';
}

function toggleCtrlNav() {
  const nav     = document.getElementById('ctrl-nav');
  const overlay = document.getElementById('ctrl-nav-overlay');
  const isOpen  = nav.classList.contains('open');
  nav.classList.toggle('open', !isOpen);
  overlay.classList.toggle('open', !isOpen);
}

function closeCtrlNav() {
  document.getElementById('ctrl-nav').classList.remove('open');
  document.getElementById('ctrl-nav-overlay').classList.remove('open');
}

function navToCard(id) {
  closeCtrlNav();
  const card = document.getElementById('card-' + id);
  if (!card) return;
  card.classList.remove('collapsed');
  setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
}

  // Charger les photos existantes depuis Firebase
  const db = getDb('cafe-elysee');
  db.ref('demoPage/heroSlides').once('value', snap => {
    const data = snap.val() || {};
    for (let i = 1; i <= DP_SLIDES; i++) {
      if (data[i]) dpSetImg(i, data[i]);
    }
  });
}

function dpUpload(i) {
  const file = document.getElementById('dp-file-' + i).files[0];
  if (!file) return;
  const lbl  = document.getElementById('dp-lbl-' + i);
  const spin = document.getElementById('dp-spin-' + i);
  lbl.style.display  = 'none';
  spin.style.display = 'block';

  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1600;
      let w = img.width, h = img.height;
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      dpSetImg(i, canvas.toDataURL('image/jpeg', 0.82)); // aperçu local immédiat
      canvas.toBlob(async blob => {
        try {
          const fd = new FormData();
          fd.append('file', blob);
          fd.append('upload_preset', DP_PRESET);
          const res  = await fetch(`https://api.cloudinary.com/v1_1/${DP_CLOUD}/image/upload`, { method: 'POST', body: fd });
          const json = await res.json();
          if (!res.ok) throw new Error(json.error?.message || 'Upload échoué');
          dpSetImg(i, json.secure_url);
          const ok = document.getElementById('dp-ok');
          try {
            await getDb('cafe-elysee').ref('demoPage/heroSlides/' + i).set(json.secure_url);
            ok.textContent = '✓ Photo enregistrée';
            ok.style.color = 'var(--green)';
          } catch(fbErr) {
            console.error('Firebase write error', fbErr);
            ok.textContent = '⚠ Erreur Firebase : ' + fbErr.message;
            ok.style.color = 'var(--red)';
          }
          ok.style.display = 'block';
          setTimeout(() => { ok.style.display = 'none'; ok.textContent = '✓ Photo enregistrée'; ok.style.color = 'var(--green)'; }, 4000);
        } catch(err) {
          console.error('dp upload error', err);
          dpSetImg(i, '');
        } finally {
          lbl.style.display  = '';
          spin.style.display = 'none';
          document.getElementById('dp-file-' + i).value = '';
        }
      }, 'image/jpeg', 0.82);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function dpDelete(i) {
  dpSetImg(i, '');
  getDb('cafe-elysee').ref('demoPage/heroSlides/' + i).set('');
}
